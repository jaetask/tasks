<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" style="max-width:760px;height:auto" role="img" aria-label="Before: the wrong path is easier, so you correct each new agent again and again. After pave: a type, lint rule or test blocks the wrong path, its message points to the right one, and the agent bounces onto it without you."><style>
svg { --paper:#fff; --ink:#0a0a0a; --muted:#525252; --accent:#0000ff; --tint:rgba(0,0,255,.05); --fill:rgba(10,10,10,.05); --line:rgba(10,10,10,.3);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif }
@media (prefers-color-scheme: dark) { svg { --paper:#0d0d10; --ink:#f2f2f2; --muted:#a3a3a3; --accent:#8894ff; --tint:rgba(136,148,255,.12); --fill:rgba(255,255,255,.06); --line:rgba(255,255,255,.3) } }
.bg { fill: var(--paper) }
.n { fill: var(--paper); stroke: var(--ink) } .s { fill: var(--fill); stroke: var(--line) }
.f { fill: var(--tint); stroke: var(--accent); stroke-width: 1.2 } .o { fill: var(--paper); stroke: var(--ink); stroke-dasharray: 5 4 }
.t { fill: var(--ink) } .m { fill: var(--muted) } .a { fill: var(--accent) }
.e { stroke: var(--ink); stroke-width: 1.2; fill: none } .ea { stroke: var(--accent); stroke-width: 1.4; fill: none }
.hm { fill: var(--ink) } .ham { fill: var(--accent) }
</style><defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hm"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ham"/></marker>
</defs><rect class="bg" x="0" y="0" width="760" height="360"/><text x="20" y="26" class="t" font-size="13" font-weight="700" text-anchor="start">Before: the wrong path is easier</text><rect x="20" y="44" width="150" height="53" rx="6" class="n"/><text x="32" y="68" class="t" font-size="12" font-weight="700" text-anchor="start">Agent</text><text x="32" y="85" class="m" font-size="11" font-weight="400" text-anchor="start">gets a task</text><path d="M170,68 L268,68" class="e" marker-end="url(#h)"/><text x="219" y="60" class="m" font-size="10" font-weight="700" text-anchor="middle">easy</text><rect x="272" y="44" width="190" height="53" rx="6" class="o"/><text x="284" y="68" class="t" font-size="12" font-weight="700" text-anchor="start">Wrong path</text><text x="284" y="85" class="m" font-size="11" font-weight="400" text-anchor="start">e.g. imports a Sheet</text><path d="M462,68 L540,68" class="e" marker-end="url(#h)"/><rect x="544" y="44" width="196" height="53" rx="6" class="s"/><text x="556" y="68" class="t" font-size="12" font-weight="700" text-anchor="start">You correct it</text><text x="556" y="85" class="m" font-size="11" font-weight="400" text-anchor="start">again, and again</text><path d="M642,92 L642,116 L95,116 L95,96" class="e" stroke-dasharray="4 4" marker-end="url(#h)"/><text x="368" y="130" class="m" font-size="10" font-weight="400" text-anchor="middle">next agent, same mistake</text><text x="20" y="176" class="t" font-size="13" font-weight="700" text-anchor="start">After: pave it</text><rect x="20" y="194" width="150" height="53" rx="6" class="n"/><text x="32" y="218" class="t" font-size="12" font-weight="700" text-anchor="start">Agent</text><text x="32" y="235" class="m" font-size="11" font-weight="400" text-anchor="start">gets a task</text><path d="M170,218 L268,218" class="e" marker-end="url(#h)"/><rect x="272" y="194" width="190" height="53" rx="6" class="n"/><text x="284" y="218" class="t" font-size="12" font-weight="700" text-anchor="start">Wrong path</text><text x="284" y="235" class="m" font-size="11" font-weight="400" text-anchor="start">blocked by a check</text><path d="M367,242 L367,276" class="ea" marker-end="url(#ha)"/><text x="375" y="264" class="a" font-size="10" font-weight="700" text-anchor="start">bounces</text><rect x="272" y="280" width="190" height="70" rx="6" class="f"/><text x="284" y="304" class="a" font-size="12" font-weight="700" text-anchor="start">Right path</text><text x="284" y="321" class="m" font-size="11" font-weight="400" text-anchor="start">the check&#x27;s message says</text><text x="284" y="338" class="m" font-size="11" font-weight="400" text-anchor="start">&quot;use EditLink instead&quot;</text><path d="M462,312 L540,312" class="ea" marker-end="url(#ha)"/><rect x="544" y="288" width="196" height="53" rx="6" class="f"/><text x="556" y="312" class="a" font-size="12" font-weight="700" text-anchor="start">Done</text><text x="556" y="329" class="m" font-size="11" font-weight="400" text-anchor="start">you never say it again</text><rect x="544" y="194" width="196" height="70" rx="6" class="s"/><text x="556" y="218" class="t" font-size="12" font-weight="700" text-anchor="start">Strongest check first</text><text x="556" y="235" class="m" font-size="11" font-weight="400" text-anchor="start">type, lint, test, tool...</text><text x="556" y="252" class="m" font-size="11" font-weight="400" text-anchor="start">a written rule is last</text></svg>