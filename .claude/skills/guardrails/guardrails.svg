<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 471" width="100%" style="max-width:830px;height:auto" role="img" aria-label="Install once and choose checks per repo; a weekly run compares each repo to last week and reports only what changed, suggesting new checks once."><style>
svg { --paper:#fff; --ink:#0a0a0a; --muted:#525252; --accent:#0000ff; --tint:rgba(0,0,255,.05); --fill:rgba(10,10,10,.05); --line:rgba(10,10,10,.3);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif }
@media (prefers-color-scheme: dark) { svg { --paper:#0d0d10; --ink:#f2f2f2; --muted:#a3a3a3; --accent:#8894ff; --tint:rgba(136,148,255,.12); --fill:rgba(255,255,255,.06); --line:rgba(255,255,255,.3) } }
.bg { fill: var(--paper) }
.n { fill: var(--paper); stroke: var(--ink) } .s { fill: var(--fill); stroke: var(--line) }
.f { fill: var(--tint); stroke: var(--accent); stroke-width: 1.2 } .o { fill: var(--paper); stroke: var(--ink); stroke-dasharray: 5 4 }
.t { fill: var(--ink) } .m { fill: var(--muted) } .a { fill: var(--accent) }
.e { stroke: var(--ink); stroke-width: 1.2; fill: none } .ea { stroke: var(--accent); stroke-width: 1.4; fill: none }
.hm { fill: var(--ink) } .ham { fill: var(--accent) }
</style><defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hm"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ham"/></marker>
</defs><rect class="bg" x="0" y="0" width="830" height="471"/><text x="20" y="22" class="t" font-size="13" font-weight="700" text-anchor="start">Guardrails: install once, then a weekly check that only speaks when something changed</text><rect x="20" y="44" width="230" height="71" rx="6" class="n"/><text x="32" y="69" class="t" font-size="13" font-weight="700" text-anchor="start">1 Install (once per repo)</text><text x="32" y="86" class="m" font-size="11" font-weight="400" text-anchor="start">finds what the repo has,</text><text x="32" y="103" class="m" font-size="11" font-weight="400" text-anchor="start">you pick checks on or off</text><path d="M250,74 L286,74" class="e" marker-end="url(#h)"/><rect x="290" y="44" width="230" height="71" rx="6" class="s"/><text x="302" y="69" class="t" font-size="13" font-weight="700" text-anchor="start">checks.yml in the repo</text><text x="302" y="86" class="m" font-size="11" font-weight="400" text-anchor="start">each check: on / off</text><text x="302" y="103" class="m" font-size="11" font-weight="400" text-anchor="start">you decide; nothing auto-enables</text><path d="M405,124 L405,152" class="e" marker-end="url(#h)"/><rect x="290" y="156" width="230" height="71" rx="6" class="n"/><text x="302" y="181" class="t" font-size="13" font-weight="700" text-anchor="start">2 Weekly run, all repos</text><text x="302" y="198" class="m" font-size="11" font-weight="400" text-anchor="start">pass/fail per check, no guessing;</text><text x="302" y="215" class="m" font-size="11" font-weight="400" text-anchor="start">never changes a repo itself</text><path d="M405,236 L405,264" class="e" marker-end="url(#h)"/><rect x="290" y="268" width="230" height="54" rx="6" class="n"/><text x="302" y="293" class="t" font-size="13" font-weight="700" text-anchor="start">3 Compare with last week</text><text x="302" y="310" class="m" font-size="11" font-weight="400" text-anchor="start">saved snapshot per repo</text><path d="M520,300 L540,300 L540,258 L556,258" class="ea" marker-end="url(#ha)"/><rect x="560" y="226" width="250" height="71" rx="6" class="f"/><text x="572" y="251" class="a" font-size="13" font-weight="700" text-anchor="start">Changed: tell you</text><text x="572" y="268" class="m" font-size="11" font-weight="400" text-anchor="start">newly broken, newly fixed,</text><text x="572" y="285" class="m" font-size="11" font-weight="400" text-anchor="start">a check that vanished</text><rect x="560" y="316" width="250" height="54" rx="6" class="n"/><text x="572" y="341" class="t" font-size="13" font-weight="700" text-anchor="start">Same as last week: silence</text><text x="572" y="358" class="m" font-size="11" font-weight="400" text-anchor="start">a known gap is never re-raised</text><rect x="560" y="392" width="250" height="71" rx="6" class="o"/><text x="572" y="417" class="t" font-size="13" font-weight="700" text-anchor="start">New idea: suggest once</text><text x="572" y="434" class="m" font-size="11" font-weight="400" text-anchor="start">a check you could enable;</text><text x="572" y="451" class="m" font-size="11" font-weight="400" text-anchor="start">dismissed stays dismissed</text><path d="M520,300 L540,300 L540,412 L556,412" class="e" marker-end="url(#h)"/><path d="M520,300 L540,300 L540,336 L556,336" class="e" marker-end="url(#h)"/><rect x="20" y="156" width="230" height="88" rx="6" class="s"/><text x="32" y="181" class="t" font-size="13" font-weight="700" text-anchor="start">Checks (start ~10, not 60)</text><text x="32" y="198" class="m" font-size="11" font-weight="400" text-anchor="start">hooks run typecheck, lint, tests;</text><text x="32" y="215" class="m" font-size="11" font-weight="400" text-anchor="start">CI exists; caches ignored;</text><text x="32" y="232" class="m" font-size="11" font-weight="400" text-anchor="start">lint bans in place; ...</text></svg>